<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
    <title>Document</title>
    <link rel="stylesheet" href="style.css"> 
</head>
<body>
    <header>
        <div class="header_search">
            <input type="text" placeholder="Search..." class="search_input">
        </div>
        <div class="header_categories">
            <button class="category-btn" data-category="all">All</button>
            <button class="category-btn" data-category="ios">IOS</button>
            <button class="category-btn" data-category="design">Designers</button>
            <button class="category-btn" data-category="management">Manager</button>
            <button class="category-btn" data-category="qa">QA</button>
            <button class="category-btn" data-category="back_office">Office</button>
            <button class="category-btn" data-category="android">Android</button>
            <button class="category-btn" data-category="frontend">Frontend</button>
            <button class="category-btn" data-category="hr">HR</button>
            <button class="category-btn" data-category="pr">PR</button>
            <button class="category-btn" data-category="backend">Backend</button>
            <button class="category-btn" data-category="support">Support</button>
            <button class="category-btn" data-category="analytics">Analytics</button>
        </div>
    </header>
    <div class="cards">
        <template id="card-template">
            <div class="card">
                <div class="card_image">
                    <img src="./img/user.svg" alt="">
                </div>
                <div class="card_content">
                    <div class="card_title"><h3>Card Title </h3><span></span></div>
                    <p>Card description goes here.</p>
                </div>
            </div>
        </template>
    </div> 
    <script src="./script.js"></script>
</body>
</html>
